<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" preserveAspectRatio="xMidYMid meet">

  <!-- Sky bleeds to viewport edges -->
  <g id="sky">
    <rect class="palette-sky" x="-200" y="-100" width="1600" height="600" />
  </g>

  <!-- Structure (thakurdalan architecture) -->
  <g id="structure">
    <!-- Left pillar -->
    <rect class="palette-structure" x="150" y="300" width="80" height="500" rx="4" />
    <rect class="palette-structure-highlight" x="150" y="300" width="8" height="500" rx="4" />
    <!-- Right pillar -->
    <rect class="palette-structure" x="970" y="300" width="80" height="500" rx="4" />
    <rect class="palette-structure-highlight" x="1042" y="300" width="8" height="500" rx="4" />
    <!-- Top arch -->
    <path class="palette-structure" d="M150 300 Q600 180 1050 300 L1050 320 Q600 220 150 320 Z" />
    <path class="palette-structure-highlight" d="M150 320 Q600 200 1050 320" fill="none" stroke="#c9973a" stroke-width="4" />
    <!-- Base platform -->
    <rect class="palette-structure" x="100" y="780" width="1000" height="40" rx="4" />
    <rect class="palette-structure-highlight" x="100" y="780" width="1000" height="6" rx="4" />
  </g>

  <!-- Chalchitra (backdrop behind protima) - alta/brass tints -->
  <g id="chalchitra">
    <ellipse class="palette-chalchitra" cx="600" cy="480" rx="280" ry="220" />
    <ellipse class="palette-chalchitra-inner" cx="600" cy="460" rx="240" ry="180" />
    <ellipse class="palette-chalchitra-accent" cx="600" cy="440" rx="200" ry="140" />
    <!-- Decorative band -->
    <ellipse class="palette-chalchitra" cx="600" cy="480" rx="270" ry="210" fill="none" stroke="#c9973a" stroke-width="2" opacity="0.3" />
  </g>

  <!-- Protima (deity) - paper/brass tints -->
  <g id="protima">
    <!-- Torso -->
    <ellipse class="palette-protima" cx="600" cy="580" rx="120" ry="140" />
    <ellipse class="palette-protima-shade" cx="550" cy="550" rx="60" ry="70" opacity="0.5" />
    <!-- Head -->
    <ellipse class="palette-protima" cx="600" cy="410" rx="90" ry="100" />
    <ellipse class="palette-protima-shade" cx="560" cy="380" rx="40" ry="45" opacity="0.5" />
    <!-- Crown -->
    <path class="palette-chalchitra" d="M510 350 Q550 300 600 320 Q650 300 690 350 L690 370 Q600 330 510 370 Z" />
    <path class="palette-haldi" d="M510 350 Q550 300 600 320 Q650 300 690 350" fill="none" stroke="#e9a82f" stroke-width="3" opacity="0.5" />
    <!-- Left arm -->
    <ellipse class="palette-protima" cx="460" cy="580" rx="40" ry="100" transform="rotate(-20 460 580)" />
    <!-- Right arm -->
    <ellipse class="palette-protima" cx="740" cy="580" rx="40" ry="100" transform="rotate(20 740 580)" />
    <!-- Third eye -->
    <ellipse class="palette-eye" cx="600" cy="390" rx="8" ry="10" />
  </g>

  <!-- Left eye (separate layer for animation) - almond shape in haldi, 2x bigger -->
  <g id="eye-l">
    <ellipse class="palette-haldi" cx="555" cy="400" rx="36" ry="28" />
    <ellipse fill="#14122b" cx="555" cy="400" rx="12" ry="16" />
  </g>

  <!-- Right eye (separate layer for animation) - almond shape in haldi, 2x bigger -->
  <g id="eye-r">
    <ellipse class="palette-haldi" cx="645" cy="400" rx="36" ry="28" />
    <ellipse fill="#14122b" cx="645" cy="400" rx="12" ry="16" />
  </g>

  <!-- String lights - sagging catenary swags between anchor points on structure top -->
  <g id="lights">
    <!-- Anchors at structure top: left pillar (150,300), right pillar (1050,300) -->
    <!-- 3 swags between anchors at x=150, 400, 650, 900, 1050 -->
    <!-- Each swag: catenary curve y = 300 + 40*cosh((x-anchor)/40) - 40 -->
    
    <!-- Swag 1: between x=150 and x=400 -->
    <ellipse class="palette-lights" cx="200" cy="335" rx="8" ry="8" opacity="0.8" />
    <ellipse class="palette-lights" cx="250" cy="340" rx="8" ry="8" opacity="0.9" />
    <ellipse class="palette-lights" cx="300" cy="342" rx="8" ry="8" opacity="1" />
    <ellipse class="palette-lights" cx="350" cy="340" rx="8" ry="8" opacity="0.9" />
    
    <!-- Swag 2: between x=400 and x=650 -->
    <ellipse class="palette-lights" cx="450" cy="335" rx="8" ry="8" opacity="0.8" />
    <ellipse class="palette-lights" cx="500" cy="340" rx="8" ry="8" opacity="0.9" />
    <ellipse class="palette-lights" cx="550" cy="342" rx="8" ry="8" opacity="1" />
    <ellipse class="palette-lights" cx="600" cy="340" rx="8" ry="8" opacity="0.9" />
    
    <!-- Swag 3: between x=650 and x=900 -->
    <ellipse class="palette-lights" cx="700" cy="335" rx="8" ry="8" opacity="0.8" />
    <ellipse class="palette-lights" cx="750" cy="340" rx="8" ry="8" opacity="0.9" />
    <ellipse class="palette-lights" cx="800" cy="342" rx="8" ry="8" opacity="1" />
    <ellipse class="palette-lights" cx="850" cy="340" rx="8" ry="8" opacity="0.9" />
    
    <!-- Swag 4: between x=900 and x=1050 -->
    <ellipse class="palette-lights" cx="950" cy="335" rx="8" ry="8" opacity="0.8" />
    <ellipse class="palette-lights" cx="1000" cy="340" rx="8" ry="8" opacity="0.9" />
  </g>

  <!-- Lamp/Pradip -->
  <g id="lamp-pradip">
    <ellipse class="palette-lamp" cx="400" cy="760" rx="30" ry="15" />
    <ellipse class="palette-lamp-glow" cx="400" cy="750" rx="18" ry="10" />
    <ellipse class="palette-lamp" cx="800" cy="760" rx="30" ry="15" />
    <ellipse class="palette-lamp-glow" cx="800" cy="750" rx="18" ry="10" />
  </g>

  <!-- Foreground bleeds to viewport edges - lighter than sky -->
  <g id="foreground">
    <rect class="palette-foreground" x="-200" y="850" width="1600" height="250" />
    <path class="palette-foreground" d="M-200 850 Q300 800 600 850 Q900 800 1200 850 Q1500 800 1600 850 L1600 1100 L-200 1100 Z" fill="#2a1a12" />
    <path class="palette-foreground-accent" d="M-200 850 Q300 800 600 850 Q900 800 1200 850 Q1500 800 1600 850" fill="none" stroke="#4a3a2f" stroke-width="3" opacity="0.3" />
  </g>
</svg>